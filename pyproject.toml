[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acrin-nsclc-survival"
version = "0.1.1"
description = "Multimodal survival model training and TCIA internal validation for the ACRIN 6668/RTOG 0235 secondary analysis."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "ACRIN 6668/RTOG 0235 Secondary Analysis Study Team"}
]
keywords = [
  "survival-analysis",
  "radiomics",
  "PET-CT",
  "non-small-cell-lung-cancer",
  "TCIA",
  "random-survival-forest",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "joblib>=1.4,<2",
  "lifelines>=0.30,<0.31",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<1.6",
  "scikit-survival>=0.23,<0.24",
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
acrin-survival = "acrin_survival.cli:main"

[project.urls]
Documentation = "https://github.com/working-ye/acrin6668-nsclc-multimodal-survival"
Issues = "https://github.com/working-ye/acrin6668-nsclc-multimodal-survival/issues"
Source = "https://github.com/working-ye/acrin6668-nsclc-multimodal-survival"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP006", "UP007", "UP035"]
